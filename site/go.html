<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Open in the app</title>
<meta name="robots" content="noindex">
<style>
  :root { --bg: #f6f7f9; --text: #16181d; --muted: #5d6573; --btn: #53d337; --btn-text: #0b1a07; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #0f1115; --text: #e8eaee; --muted: #9aa3b2; }
  }
  body { margin: 0; background: var(--bg); color: var(--text); min-height: 100vh; display: grid; place-items: center;
         font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 420px; padding: 24px 16px; text-align: center; }
  a.btn { display: inline-block; background: var(--btn); color: var(--btn-text); font-weight: 700; text-decoration: none;
          padding: 14px 22px; border-radius: 12px; margin: 16px 0; }
  p { color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1 id="title">Opening the app…</h1>
  <a class="btn" id="open" href="#">Open in the app</a>
  <p id="note">If the app didn't open, tap the button. Nothing is bet until you confirm it in the app.</p>
</main>
<script>
  // Only sportsbook app links (and FanDuel's own bet-slip pages) are allowed through: this page can't send anyone
  // anywhere else. to=: an app link, opened at once. web=: a FanDuel bet-slip page, opened by a tap on the button
  // (a tap on a link to another site is what makes iOS hand it to the FanDuel app).
  var q = new URLSearchParams(location.search), to = q.get("to") || "", web = q.get("web") || "";
  var app = /^(dksb:\/\/sb\/addbet\/|fanduelsportsbook:\/\/|fdsb:\/\/)[^\s<>"']+$/;
  var fd = /^https:\/\/[a-z]+\.sportsbook\.fanduel\.com\/addToBetslip\?[^\s<>"']+$|^https:\/\/sportsbook\.fanduel\.com\/addToBetslip\?[^\s<>"']+$/;
  var name = /^dksb:/.test(to) ? "DraftKings" : "FanDuel";
  document.getElementById("title").textContent = "Opening " + name + "…";
  document.getElementById("open").textContent = "Open in the " + name + " app";
  if (app.test(to)) {
    document.getElementById("open").href = to;
    location.href = to;
  } else if (fd.test(web)) {
    document.getElementById("open").href = web;
    document.getElementById("title").textContent = "Tap to open FanDuel";
    document.getElementById("note").textContent = "Nothing is bet until you confirm it in the app.";
  } else {
    document.getElementById("title").textContent = "This link isn't a sportsbook bet.";
    document.getElementById("open").hidden = true;
    document.getElementById("note").textContent = "Go back to Discord and open the bet from the card.";
  }
</script>
</body>
</html>
